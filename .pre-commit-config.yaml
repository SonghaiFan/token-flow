repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest
        name: pytest (fast, excludes slow/e2e)
        entry: uv run pytest -x -q --timeout=30 -m "not slow and not real_e2e" --ignore=tests/e2e
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: full-check-reminder
        name: full check reminder
        entry: sh -c 'echo "Pre-commit skips slow/e2e and the Next.js build. Run the relevant full checks before sharing changes."; exit 0'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

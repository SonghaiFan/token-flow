[project]
name = "token-flow"
dynamic = ["version"]
description = "Local-first AI agent trace capture and conversation analysis."
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "SonghaiFan" }]
readme = "README.md"
keywords = ["ai-agents", "codex", "claude", "gemini", "trace", "proxy", "tokens", "cache", "local-first"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "aiohttp==3.14.1",
    "backports-zstd>=1.0; python_version < '3.14'",
    "cryptography>=42.0",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.urls]
Homepage = "https://github.com/SonghaiFan/token-flow"
Repository = "https://github.com/SonghaiFan/token-flow"
Issues = "https://github.com/SonghaiFan/token-flow/issues"

[project.scripts]
token-flow = "claude_tap.commands.cli:main_entry"

[build-system]
requires = ["setuptools>=68.0", "setuptools-scm[toml]>=8.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["claude_tap", "claude_tap.analysis", "claude_tap.capture", "claude_tap.commands", "claude_tap.core", "claude_tap.server", "claude_tap.storage", "claude_tap.viewer_assets"]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"

[tool.setuptools.package-data]
claude_tap = ["dashboard.html", "viewer.html", "viewer_i18n.json", "model_prices.json", "py.typed", "static_ui/*", "static_ui/**/*"]
"claude_tap.viewer_assets" = ["*.css", "*.js", "*.LICENSE.txt"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "pexpect>=4.9",
    "coverage>=7.6",
    "ruff>=0.11",
    # Pinned exactly: CI caches ~/.cache/ms-playwright keyed on this file's hash,
    # and each playwright release expects its own browser revision. A floating
    # spec would install a version whose revision is absent from the cache,
    # forcing a fresh browser download on every run.
    "playwright==1.58.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "asyncio: marks tests as async (run by pytest-asyncio)",
    "real_e2e: marks tests as real E2E tests requiring claude CLI (use --run-real-e2e)",
]
timeout = 60

[tool.coverage.run]
source = ["claude_tap"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true

[dependency-groups]
# Kept as a thin alias so `uv run` (which auto-activates this group) and
# `pip install -e ".[dev]"` install the same set. Declare dev tooling in
# [project.optional-dependencies] only — pip cannot read PEP 735 groups.
dev = [
    "token-flow[dev]",
]
